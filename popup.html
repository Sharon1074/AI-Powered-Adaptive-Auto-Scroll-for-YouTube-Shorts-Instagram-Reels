<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 14px;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .subtitle { font-size: 11px; color: #888; margin-bottom: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    label { font-size: 13px; }
    input[type="range"] { width: 140px; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555; transition: .2s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4caf50; }
    input:checked + .slider:before { transform: translateX(18px); }
    .section-label { font-size: 12px; color: #aaa; margin: 10px 0 6px; }
    .cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cat-name { font-size: 11px; width: 90px; text-transform: capitalize; color: #ccc; }
    .bar-bg { background: #333; border-radius: 4px; height: 7px; flex: 1; overflow: hidden; }
    .bar-fill { background: #4caf50; height: 100%; }
    .empty-note { font-size: 11px; color: #666; font-style: italic; }
    button {
      width: 100%; padding: 6px; margin-top: 10px;
      background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <h1>AI Auto-Scroll</h1>
  <div class="subtitle">On-device MobileNet · nothing leaves your browser</div>

  <div class="row">
    <label>Enabled</label>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label>Sensitivity</label>
    <input type="range" id="sensitivitySlider" min="0.5" max="2" step="0.1" />
  </div>

  <div class="section-label">Learned interests — YouTube</div>
  <div id="ytCategories"></div>

  <div class="section-label">Learned interests — Instagram</div>
  <div id="igCategories"></div>

  <button id="resetBtn">Reset learned preferences</button>

  <script src="popup.js"></script>
</body>
</html>
